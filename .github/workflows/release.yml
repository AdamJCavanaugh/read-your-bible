name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Build Android App Bundle (release)
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (release)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-release
          path: build/ios/iphoneos/Runner.app
          retention-days: 90

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web (release)
        run: flutter build web --release

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web-release
          path: build/web/
          retention-days: 90

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-release
          path: build/windows/x64/release/bundle/
          retention-days: 90

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS (release)
        run: flutter build macos --release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/
          retention-days: 90

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-release
          path: build/linux/x64/release/bundle/
          retention-days: 90

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-web, build-windows, build-macos, build-linux]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4.2.1
        with:
          path: artifacts

      - name: Prepare Android files
        run: |
          mkdir -p release/android
          cp artifacts/android-release/app-release.apk release/android/ 2>/dev/null || true
          cp artifacts/android-release/app-release.aab release/android/ 2>/dev/null || true

      - name: Prepare iOS files
        run: |
          mkdir -p release/ios
          # iOS .app is a directory, zip it
          if [ -d "artifacts/ios-release/Runner.app" ]; then
            cd artifacts/ios-release && zip -r ../../release/ios/Runner.app.zip Runner.app
          fi

      - name: Prepare Web files
        run: |
          mkdir -p release/web
          if [ -d "artifacts/web-release" ]; then
            cd artifacts/web-release && zip -r ../../release/web/web-release.zip .
          fi

      - name: Prepare Windows files
        run: |
          mkdir -p release/windows
          if [ -d "artifacts/windows-release" ]; then
            cd artifacts/windows-release && zip -r ../../release/windows/windows-release.zip .
          fi

      - name: Prepare macOS files
        run: |
          mkdir -p release/macos
          if [ -d "artifacts/macos-release" ]; then
            cd artifacts/macos-release && zip -r ../../release/macos/macos-release.zip .
          fi

      - name: Prepare Linux files
        run: |
          mkdir -p release/linux
          if [ -d "artifacts/linux-release" ]; then
            cd artifacts/linux-release && zip -r ../../release/linux/linux-release.zip .
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Downloads
            - **Android**: APK & App Bundle
            - **iOS**: Unsigned .app (requires Xcode codesigning for distribution)
            - **Web**: Static files (zip)
            - **Windows**: Executable bundle (zip)
            - **macOS**: App bundle (zip)
            - **Linux**: Executable bundle (zip)

            ## Installation
            - **Android**: Install APK directly or upload AAB to Play Console
            - **iOS**: Open .app in Xcode, codesign, and distribute via TestFlight/App Store
            - **Web**: Deploy `web-release.zip` contents to any static hosting
            - **Desktop**: Extract zip and run the executable
          files: |
            release/android/app-release.apk
            release/android/app-release.aab
            release/ios/Runner.app.zip
            release/web/web-release.zip
            release/windows/windows-release.zip
            release/macos/macos-release.zip
            release/linux/linux-release.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}